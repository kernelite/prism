[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelite-prism"
version = "0.2.0"
description = "AI-driven extraction tool for converting Linux driver C code into structured hardware and C++ microkernel specifications."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "bitsandbytes>=0.43.0",
    "pydantic>=2.6.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "jsonschema>=4.21.0",
    "jinja2>=3.1.3",
    "outlines>=0.1.0",
    "openai>=1.30.0",
    "instructor>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
kernelite-prism = "kernelite_prism.cli:main"
kprism = "kernelite_prism.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kernelite_prism = ["schemas/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["linux", ".git", ".devcontainer", "build", "*.egg-info"]
