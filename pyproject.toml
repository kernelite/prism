[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelite-prism"
version = "0.1.0"
description = "AI-driven extraction tool for converting Linux driver C code into structured specifications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
kprism = "kernelite_prism.cli:main"
kernelite-prism = "kernelite_prism.cli:main"
